[project]
name = "autonomous-multi-step-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "python-docx>=1.1.0",
    "icalendar>=5.0.0",
    "PyPDF2>=3.0.0",
    "pytz>=2024.1",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[tool.vercel]
entrypoint = "api:app"
